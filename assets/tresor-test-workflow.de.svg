<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="405" viewBox="0 0 1440 405" role="img" aria-labelledby="title desc">
<title id="title">Tresor Testablauf — ausschließlich künstliche Daten</title><desc id="desc">Drei Schritte: Testdateien erzeugen, isoliert testen und Testdaten anschließend entfernen. Keine echten Dokumente verwenden.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1422"/><stop offset="1" stop-color="#13263A"/></linearGradient>
<linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6EE7D1"/><stop offset="1" stop-color="#83B6E9"/></linearGradient>
</defs>
<rect width="1440" height="405" rx="22" fill="url(#bg)"/>
<path d="M0 77H1440M0 360H1440" stroke="#29445B" stroke-width="1.2"/>
<text x="48" y="50" fill="#F0F7FB" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Sicherer Ablauf für Beta-Tests</text>
<text x="1390" y="50" text-anchor="end" fill="#88AFBE" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">TESTABLAUF / KONZEPT</text>
<g font-family="Arial, Helvetica, sans-serif">
<g transform="translate(52 106)">
 <rect width="406" height="229" rx="16" fill="#182A3C" stroke="#3D6174"/>
 <text x="24" y="43" fill="#77E7D0" font-size="13" letter-spacing="2.5" font-weight="700">01 / VORBEREITEN</text>
 <rect x="24" y="66" width="52" height="59" rx="10" fill="#294C52"/>
 <path d="M38 78h17l9 9v26H38z" fill="none" stroke="#A3EADD" stroke-width="2"/><path d="M55 78v10h9" fill="none" stroke="#A3EADD" stroke-width="2"/>
 <text x="89" y="95" fill="#F1F7FC" font-size="21" font-weight="700">Testdateien anlegen</text>
 <text x="24" y="158" fill="#A6BAC8" font-size="16">Nur künstliche Beispiele verwenden.</text>
 <text x="24" y="183" fill="#A6BAC8" font-size="16">Niemals echte oder private Daten.</text>
 <rect x="24" y="201" width="170" height="18" rx="9" fill="#2C534E"/><text x="109" y="214" fill="#BBF3E4" text-anchor="middle" font-size="10" letter-spacing="1.2">NUR TESTEINGABEN</text>
</g>
<path d="M471 214H508m-11-11 11 11-11 11" stroke="url(#head)" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(518 106)">
 <rect width="406" height="229" rx="16" fill="#182A3C" stroke="#3D6174"/>
 <text x="24" y="43" fill="#9BCFF7" font-size="13" letter-spacing="2.5" font-weight="700">02 / TESTEN</text>
 <rect x="24" y="66" width="52" height="59" rx="10" fill="#2D4560"/>
 <rect x="38" y="79" width="24" height="28" rx="4" stroke="#C0DBFC" stroke-width="2" fill="none"/>
 <path d="M44 92l5 5 8-10" fill="none" stroke="#C0DBFC" stroke-width="2"/>
 <text x="89" y="95" fill="#F1F7FC" font-size="21" font-weight="700">Isoliert testen</text>
 <text x="24" y="158" fill="#A6BAC8" font-size="16">Verhalten prüfen, Fehler erfassen</text>
 <text x="24" y="183" fill="#A6BAC8" font-size="16">und Wiederherstellung testen.</text>
 <rect x="24" y="201" width="188" height="18" rx="9" fill="#2D4D6B"/><text x="118" y="214" fill="#C7E5FF" text-anchor="middle" font-size="10" letter-spacing="1.2">EXPERIMENTELLE BETA</text>
</g>
<path d="M937 214H974m-11-11 11 11-11 11" stroke="url(#head)" stroke-width="3" fill="none" stroke-linecap="round"/>
<g transform="translate(984 106)">
 <rect width="406" height="229" rx="16" fill="#182A3C" stroke="#3D6174"/>
 <text x="24" y="43" fill="#FFCB9D" font-size="13" letter-spacing="2.5" font-weight="700">03 / BEREINIGEN</text>
 <rect x="24" y="66" width="52" height="59" rx="10" fill="#64503F"/>
 <path d="M38 85h24M42 85l2 26h13l3-26M45 79h10" stroke="#FFD7B4" stroke-width="2" stroke-linecap="round" fill="none"/>
 <text x="89" y="95" fill="#F1F7FC" font-size="21" font-weight="700">Testdaten entfernen</text>
 <text x="24" y="158" fill="#A6BAC8" font-size="16">Ergebnisse sichern, Demos löschen.</text>
 <text x="24" y="183" fill="#A6BAC8" font-size="16">Nicht auf Beta-Daten verlassen.</text>
 <rect x="24" y="201" width="170" height="18" rx="9" fill="#664B3D"/><text x="109" y="214" fill="#FFE0C1" text-anchor="middle" font-size="10" letter-spacing="1.2">KEINE ECHTDATEN</text>
</g>
</g>
<text x="720" y="387" text-anchor="middle" fill="#A9C7D2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">KEINE ECHTEN DATEIEN • KEIN PRODUKTIVBETRIEB • KEINE SPEICHERGARANTIE</text>
</svg>